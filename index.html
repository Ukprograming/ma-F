<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>弾性力と物体の運動解析</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-app: #0f172a;
            --bg-panel: #1e293b;
            --border: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --primary: #3b82f6;
            --danger: #ef4444;
            --warn: #f59e0b;
            --radius: 8px;
            --header-h: 48px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            height: var(--header-h);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
            white-space: nowrap;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* --- Main Layout --- */
        .app-grid {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Left Panel (Video & Tools) --- */
        .video-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            overflow: hidden;
            border-right: 1px solid var(--border);
            min-width: 0;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Video Toolbar */
        .toolbar {
            background: var(--bg-panel);
            padding: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .tool-group {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 6px;
            border-radius: var(--radius);
        }

        /* --- Right Panel (Data) --- */
        .data-panel {
            width: 360px;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 5;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .kpi-card {
            background: var(--bg-panel);
            padding: 8px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .kpi-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .kpi-val {
            font-size: 15px;
            font-weight: 700;
            font-feature-settings: "tnum";
            margin-top: 2px;
        }

        /* Chart Section */
        .chart-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 280px;
        }

        .chart-controls {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .panel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .series-toggle-row {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 6px;
        }

        .series-toggle-row label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #cbd5e1;
            white-space: nowrap;
        }

        .series-swatch {
            width: 6px;
            height: 6px;
            border-radius: 2px;
            display: inline-block;
        }

        .chart-container {
            position: relative;
            height: 280px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            touch-action: none;
        }

        /* Table Section */
        .table-section {
            height: 130px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: auto;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 4px 8px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            position: sticky;
            top: 0;
            background: #111;
            z-index: 1;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
        }

        th:first-child,
        td:first-child {
            text-align: center;
        }

        /* --- UI Elements --- */
        button {
            cursor: pointer;
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: opacity 0.2s;
            white-space: nowrap;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.7;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button.primary {
            background: var(--primary);
        }

        button.accent {
            background: var(--accent);
            color: #000;
        }

        button.warn {
            background: var(--warn);
            color: #000;
        }

        button.danger {
            background: var(--danger);
        }

        .icon-btn {
            padding: 8px 14px;
            font-weight: bold;
            font-size: 16px;
            line-height: 1;
        }

        input[type="number"] {
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px;
            width: 50px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
        }

        input[type="file"]::file-selector-button {
            background: #334155;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }

        input[type="file"] {
            color: #ccc;
            font-size: 11px;
            max-width: 180px;
        }

        #time-cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: rgba(239, 68, 68, 0.8);
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* --- Responsive --- */
        @media (max-width: 820px) {
            body {
                height: auto;
                overflow: auto;
                display: block;
            }

            .app-grid {
                display: block;
                height: auto;
                overflow: visible;
            }

            .video-panel {
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .canvas-wrapper {
                aspect-ratio: 16/9;
                max-height: 50vh;
            }

            .data-panel {
                width: 100%;
                height: auto;
                border-left: none;
            }

            .scroll-area {
                overflow: visible;
            }

            .header-controls {
                display: none;
            }

            h1 {
                font-size: 14px;
            }

            .toolbar {
                padding: 4px;
                overflow-x: auto;
                justify-content: flex-start;
            }

            button {
                font-size: 11px;
                padding: 6px 10px;
            }
        }

        header { height:auto; min-height:48px; flex-wrap:wrap; gap:8px; padding:10px 12px; }
        header > div:first-child { flex-wrap:wrap; min-width:0; }
        #file { max-width:240px; width:100%; }
        .header-controls { display:flex; flex-wrap:wrap; }
        .header-controls button { min-height:36px; }
        .data-panel { width:var(--data-width, 440px); min-width:0; }
        .scroll-area, .chart-section { min-height:0; }
        .chart-section, .table-section { flex-shrink:0; }
        .chart-controls { flex-wrap:wrap; }
        .tool-group { flex-wrap:wrap; max-width:100%; }
        #sessionStatus { margin:0; padding:7px 12px; color:var(--text-muted); font-size:12px; background:var(--bg-panel); overflow-wrap:anywhere; }
        .splitter { flex:0 0 10px; background:var(--border); cursor:col-resize; touch-action:none; }
        .splitter:hover, .splitter:focus { background:var(--primary); }
        .modeBtn[aria-pressed="true"] { background:var(--primary); outline:1px solid #93c5fd; }
        .table-section { resize:vertical; min-height:110px; max-height:70vh; }
        .timeline { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--bg-panel); }
        #videoSeek { flex:1; min-width:30px; width:auto; }
        #videoTime { font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
        body.graph-focus .video-panel, body.graph-focus .splitter { display:none; }
        body.graph-focus .data-panel { width:100%; flex:1; }
        body.graph-focus .chart-container { height:60vh; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid #93c5fd; outline-offset:2px; }
        @media (max-width:820px) {
            .header-controls { display:flex; }
            .video-panel { position:relative; }
            .data-panel { width:100%; }
            .splitter { display:none; }
            .toolbar { overflow:visible; }
            .canvas-wrapper { height:clamp(180px, 40vh, 420px); }
            .scroll-area { padding:8px; }
        }
    </style>
</head>

<body>
    <header>
        <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
            <h1>弾性力と物体の運動解析</h1>
            <input id="file" type="file" accept="video/*" />
        </div>
        <div class="header-controls">
            <button id="btnAnalysisSave" title="動画を除く計測点・設定をJSONに保存">解析保存</button>
            <button id="btnAnalysisOpen">解析を開く</button>
            <button id="btnCancelRestore" hidden>復元待ちを取消</button>
            <input id="analysisFile" type="file" accept=".json,application/json" hidden>
            <button id="btnDemo" class="warn" style="padding:4px 8px; font-size:11px;">デモ</button>
            <button id="btnCSV" class="primary" style="padding:4px 8px; font-size:11px;">CSV</button>
        </div>
    </header>

    <p id="sessionStatus" role="status" aria-live="polite">動画を選択 → スケール設定 → 座標軸設定 → 計測開始。解析保存には動画を含みません。</p>
    <div class="app-grid">
        <div class="video-panel">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
                <video id="video" playsinline muted preload="auto" style="display:none"></video>
                <div style="position:absolute; top:8px; left:8px; font-size:11px; color:rgba(255,255,255,0.7); pointer-events:none;">
                    <span id="scaleInfo">スケール: 未設定</span> / <span id="originInfo">原点: 未設定</span>
                </div>
            </div>

            <div class="timeline"><input id="videoSeek" aria-label="動画の再生位置" type="range" min="0" max="1" step="0.001" value="0" disabled><output id="videoTime">0.000 / 0.000 s</output></div>
            <div class="toolbar">
                <div class="tool-group">
                    <button id="btnPrev" class="icon-btn">◀</button>
                    <button id="btnPlay" class="primary" style="min-width:60px">再生</button>
                    <button id="btnNext" class="icon-btn">▶</button>
                </div>

                <div class="tool-group">
                    <span style="font-size:11px; color:#aaa; margin-left:2px;">FPS</span>
                    <input id="fps" type="number" step="0.01" value="30">
                    <label style="font-size:11px; display:flex; align-items:center; margin:0 4px; white-space:nowrap;">
                        <input id="autoStep" type="checkbox" checked> <span style="margin-left:2px">自動送り</span>
                    </label>
                </div>

                <div class="tool-group">
                    <button id="btnCalib" class="accent">スケール設定</button>
                    <span style="font-size:11px; color:#aaa;">基準長[m]</span>
                    <input id="calibLength" type="number" step="0.01" min="0.001" value="1" style="width:72px;">
                    <button id="btnAxis" class="accent" disabled>座標軸設定</button>
                    <button id="btnStartPlot" class="primary" disabled>計測開始</button>
                </div>

                <div class="tool-group">
                    <span style="font-size:11px; color:#aaa;">追跡対象</span>
                    <select id="trackSelect" style="background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px; font-size:13px;">
                        <option value="obj1">物体1</option>
                        <option value="obj2">物体2</option>
                    </select>
                </div>

                <div class="tool-group">
                    <button id="btnUndo" class="warn">戻す</button>
                    <button id="btnClear" class="danger">全消去</button>
                </div>
            </div>
        </div>

        <div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="動画とデータ欄の幅を調整。左右キーでも調整できます" aria-orientation="vertical"></div>
        <div class="data-panel">
            <div class="scroll-area">
                <div class="panel-controls">
                    <label style="font-size:11px; color:#cbd5e1; display:flex; align-items:center; gap:4px;">
                        <input id="chkPlotRange" type="checkbox">
                        プロット時間のみ表示
                    </label>
                    <button id="btnToggleKpi" style="padding:3px 8px; font-size:10px;">指標を表示</button>
                </div>

                <div id="kpiGrid" class="kpi-grid" style="display:none;">
                    <div class="kpi-card">
                        <div class="kpi-label">計測点数</div>
                        <div id="kPoints" class="kpi-val">0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">計測時間 [s]</div>
                        <div id="kTime" class="kpi-val">0.000</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">スケール [px/m]</div>
                        <div id="kScale" class="kpi-val">--</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">FPS (推定)</div>
                        <div id="kFPS" class="kpi-val">30.00</div>
                    </div>
                </div>

                <div class="chart-section">
                    <div class="chart-controls">
                        <button class="modeBtn" data-mode="xt" style="padding:4px 8px; font-size:11px;">x-t</button>
                        <button class="modeBtn" data-mode="yt" style="padding:4px 8px; font-size:11px;">y-t</button>
                        <button class="modeBtn" data-mode="vxt" style="padding:4px 8px; font-size:11px;">vx</button>
                        <button class="modeBtn" data-mode="vyt" style="padding:4px 8px; font-size:11px;">vy</button>
                        <button class="modeBtn" data-mode="axt" style="padding:4px 8px; font-size:11px;">ax</button>
                        <button class="modeBtn" data-mode="ayt" style="padding:4px 8px; font-size:11px;">ay</button>
                        <button class="modeBtn" data-mode="springnorm" style="padding:4px 8px; font-size:11px;">ばね比較</button>
                        <button id="btnGraphOnly" aria-pressed="false">グラフ拡大</button>
                        <button id="btnPNGCurrent" style="margin-left:auto; padding:4px 6px; font-size:10px;">画像保存</button>
                    </div>
                    <div id="seriesToggleRow" class="series-toggle-row">
                        <label><input id="seriesForce" type="checkbox" checked><span class="series-swatch" style="background:#f43f5e;"></span>弾性力</label>
                        <label><input id="seriesPos" type="checkbox" checked><span class="series-swatch" style="background:#22c55e;"></span>位置</label>
                        <label><input id="seriesVel" type="checkbox" checked><span class="series-swatch" style="background:#3b82f6;"></span>速度</label>
                        <label><input id="seriesAcc" type="checkbox" checked><span class="series-swatch" style="background:#f59e0b;"></span>加速度</label>
                    </div>
                    <div class="kpi-card" style="padding:8px;">
                        <div class="kpi-label" style="margin-bottom:6px;">ばね・回帰設定</div>
                        <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px;">
                            <label style="display:flex; align-items:center; gap:6px; font-size:11px; color:#cbd5e1;">ばね定数 k[N/m]<input id="springK" type="number" step="0.01" value="10" style="width:72px;"></label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:11px; color:#cbd5e1;">回帰半窓幅<input id="regHalfWindow" type="number" min="1" max="20" step="1" value="7" style="width:72px;"></label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:11px; color:#cbd5e1;">物体トラック<select id="massTrackSelect" style="background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px; font-size:12px;"><option value="obj1">物体1</option><option value="obj2">物体2</option></select></label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:11px; color:#cbd5e1;">ばね端トラック<select id="springTrackSelect" style="background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px; font-size:12px;"><option value="obj2">物体2</option><option value="obj1">物体1</option></select></label>
                        </div>
                    </div>
                    <div id="chartBox" class="chart-container">
                        <canvas id="chart_main"></canvas>
                        <div id="time-cursor"></div>
                    </div>
                </div>

                <div class="table-section">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>t</th>
                                <th>x</th>
                                <th>y</th>
                                <th>vx</th>
                                <th>vy</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div style="font-size:11px; color:#64748b; line-height:1.4;">
                    1. 動画を読み込む  2. 「スケール設定」で基準長を指定  3. 「座標軸設定」で原点と向きを設定  4. 「計測開始」後に物体をクリックして記録
                </div>
                <div class="tool-group" style="display:flex; justify-content:center; margin-top:10px; padding:0; background:none;">
                    <button id="btnCSVMobile" class="primary" style="width:100%; display:none;">CSV出力</button>
                </div>
            </div>
        </div>
    </div>

    <script src="analysis-store.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
        (() => {
            const DEMO_URL = "./demo_faststart.mp4";

            // DOM refs
            const file = document.getElementById('file');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnPlay = document.getElementById('btnPlay');
            const btnCalib = document.getElementById('btnCalib');
            const calibLengthInput = document.getElementById('calibLength');
            const btnUndo = document.getElementById('btnUndo');
            const btnClear = document.getElementById('btnClear');
            const btnDemo = document.getElementById('btnDemo');
            const fpsInput = document.getElementById('fps');
            const autoStep = document.getElementById('autoStep');
            const scaleInfo = document.getElementById('scaleInfo');
            const originInfo = document.getElementById('originInfo');
            const kPoints = document.getElementById('kPoints');
            const kTime = document.getElementById('kTime');
            const kScale = document.getElementById('kScale');
            const kFPS = document.getElementById('kFPS');
            const btnCSV = document.getElementById('btnCSV');
            const btnCSVMobile = document.getElementById('btnCSVMobile');
            const btnPNGCurrent = document.getElementById('btnPNGCurrent');
            const btnAxis = document.getElementById('btnAxis');
            const btnStartPlot = document.getElementById('btnStartPlot');
            const trackSelect = document.getElementById('trackSelect');
            const modeButtons = document.querySelectorAll('.modeBtn');
            const springKInput = document.getElementById('springK');
            const regHalfWindowInput = document.getElementById('regHalfWindow');
            const massTrackSelect = document.getElementById('massTrackSelect');
            const springTrackSelect = document.getElementById('springTrackSelect');
            const chkPlotRange = document.getElementById('chkPlotRange');
            const btnToggleKpi = document.getElementById('btnToggleKpi');
            const kpiGrid = document.getElementById('kpiGrid');
            const seriesToggleRow = document.getElementById('seriesToggleRow');
            const seriesForce = document.getElementById('seriesForce');
            const seriesPos = document.getElementById('seriesPos');
            const seriesVel = document.getElementById('seriesVel');
            const seriesAcc = document.getElementById('seriesAcc');

            // State
            const TRACKS = [
                { id: 'obj1', label: '物体1', lineColor: '#38bdf8', pointColor: '#10b981' },
                { id: 'obj2', label: '物体2', lineColor: '#fb923c', pointColor: '#f97316' }
            ];
            let tracks = Object.fromEntries(TRACKS.map(t => [t.id, { points: [], origin: null }]));
            let currentTrackId = 'obj1';
            let scalePxPerMeter = null;
            let calibMode = false;
            let playing = false;

            // Calibration & Axis
            let calibStart = null, calibEnd = null, calibDragging = false;
            let axisMode = false;
            let axisActive = false;
            let axis = { ox: 0, oy: 0, theta: 0 };
            const AXIS_HANDLE_R = 12;
            const AXIS_HANDLE_LEN = 80;

            // Chart
            const ch = new Chart(document.getElementById('chart_main'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'x-t', data: [], pointRadius: 2, tension: 0, borderColor: '#3b82f6', backgroundColor: '#3b82f6' }] },
                options: {
                    animation: false, responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'linear', min: 0, title: { display: true, text: 't [s]', color: '#94a3b8' }, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { title: { display: true, text: '', color: '#94a3b8' }, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            let mode = 'xt';
            let currentVideoInfo = null, pendingAnalysis = null, videoReady = false, dirty = false, loadingVideo = false;
            const status = document.getElementById('sessionStatus');
            const seek = document.getElementById('videoSeek');
            const settingsInputs = [fpsInput, calibLengthInput, springKInput, regHalfWindowInput, massTrackSelect, springTrackSelect, autoStep, chkPlotRange, seriesForce, seriesPos, seriesVel, seriesAcc, trackSelect];
            settingsInputs.forEach(el => el.addEventListener('input', () => { dirty = true; }));
            const cancelRestore = document.getElementById('btnCancelRestore');
            cancelRestore.onclick = () => { pendingAnalysis = null; cancelRestore.hidden = true; status.textContent = '復元待ちを取り消しました。現在の解析を続けられます。'; };
            function allowReplace() {
                return !dirty || confirm('未保存の変更があります。「解析保存」で保存できます。変更を破棄して続けますか？（キャンセルで戻ります）');
            }
            window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
            function makePayload() {
                return AnalysisStore.validate({
                    format:'ma-f-analysis', version:1, video:currentVideoInfo,
                    analysis: { tracks, scalePxPerMeter, axis, axisActive, currentTrackId, currentTime:video.currentTime,
                        settings: { fps:Number(fpsInput.value), calibrationLength:Number(calibLengthInput.value), springK:Number(springKInput.value),
                            regressionHalfWindow:Number(regHalfWindowInput.value), massTrack:massTrackSelect.value, springTrack:springTrackSelect.value,

                    }

            }
            document.getElementById('btnAnalysisSave').onclick = () => {
                if (!videoReady || !currentVideoInfo) return alert('先に動画を読み込んでください。');
                try {
                    const payload = makePayload();
                    const url = URL.createObjectURL(new Blob([JSON.stringify({ ...payload, savedAt:new Date().toISOString() }, null, 2)], {type:'application/json'}));
                    const link = document.createElement('a');
                    link.href = url; link.download = currentVideoInfo.name.replace(/\.[^.]+$/, '').replace(/[<>:"/\\|?*]/g, '_') + '.ma-f.json'; link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    dirty = false; status.textContent = '解析ファイルのダウンロードを開始しました。元動画も一緒に保管してください。';
                } catch (_) { alert('設定値を確認してください。FPSは1〜240、基準長は正の数、ばね定数は0以上、回帰半窓幅は1〜20の整数にしてください。'); }
            };
            function matchesVideo(saved, loaded) {
                return saved.name === loaded.name && (saved.size === null || loaded.size === null || saved.size === loaded.size)
                    && saved.width === loaded.width && saved.height === loaded.height && Math.abs(saved.duration - loaded.duration) < 0.1;
            }
            function applyAnalysis(payload) {

                currentTrackId = a.currentTrackId; trackSelect.value = currentTrackId;
                calibMode = calibDragging = axisMode = false; calibStart = calibEnd = null;
                fpsInput.value = s.fps; calibLengthInput.value = s.calibrationLength; springKInput.value = s.springK;
                regHalfWindowInput.value = s.regressionHalfWindow; massTrackSelect.value = s.massTrack; springTrackSelect.value = s.springTrack;
                autoStep.checked = s.autoStep; chkPlotRange.checked = s.plotRange;
                [seriesForce, seriesPos, seriesVel, seriesAcc].forEach((el, i) => { el.checked = s.series[i]; });
                mode = s.mode; btnCalib.disabled = false; btnAxis.disabled = !scalePxPerMeter;
                btnStartPlot.disabled = !scalePxPerMeter;
                btnStartPlot.textContent = axisActive ? '計測を停止' : '計測開始';
                kFPS.textContent = Number(s.fps).toFixed(2);
                kScale.textContent = scalePxPerMeter ? scalePxPerMeter.toFixed(2) : '--';
                scaleInfo.textContent = scalePxPerMeter ? `スケール: ${scalePxPerMeter.toFixed(2)} px/m` : 'スケール: 未設定';
                video.currentTime = a.currentTime;
                refreshCurrentTrackInfo(); recompute(); drawFrame(); updateTimeline(); dirty = false;
                status.textContent = '解析を復元しました：' + payload.video.name + '。計測点・ばね設定・グラフを復元済みです。';
            }
            const analysisFile = document.getElementById('analysisFile');
            document.getElementById('btnAnalysisOpen').onclick = () => { analysisFile.click(); };
            analysisFile.onchange = async () => {
                const selected = analysisFile.files?.[0];
                if (!selected) return;
                try {
                    if (selected.size > 30 * 1024 * 1024) throw new Error('解析ファイルは30 MB以下にしてください。');
                    const payload = AnalysisStore.validate(JSON.parse(await selected.text()));
                    if (!allowReplace()) return;
                    if (videoReady && matchesVideo(payload.video, currentVideoInfo)) { pendingAnalysis = null; cancelRestore.hidden = true; applyAnalysis(payload); }
                    else {
                        pendingAnalysis = payload;
                        cancelRestore.hidden = false;
                        status.textContent = '復元待ち：元動画「' + payload.video.name + '」を選択してください。現在の解析は動画が一致するまで保持します。';
                    }
                } catch (error) { alert(error instanceof SyntaxError ? 'JSONを読み取れません。解析保存で作成したファイルを選んでください。' : error.message); }
                finally { analysisFile.value = ''; }
            };
            function updateTimeline() {
                seek.disabled = !videoReady;
                seek.max = videoReady ? video.duration : 1;
                seek.value = video.currentTime || 0;
                document.getElementById('videoTime').textContent = `${(video.currentTime || 0).toFixed(3)} / ${(videoReady ? video.duration : 0).toFixed(3)} s`;
            }
            video.addEventListener('timeupdate', updateTimeline);
            seek.oninput = () => { if (videoReady) { video.pause(); video.currentTime = Number(seek.value); } };
            const graphToggle = document.getElementById('btnGraphOnly');
            graphToggle.onclick = () => {
                const active = document.body.classList.toggle('graph-focus');
                graphToggle.textContent = active ? '動画とデータに戻す' : 'グラフ拡大';
                graphToggle.setAttribute('aria-pressed', String(active));
                requestAnimationFrame(() => { ch.resize(); resizeCanvasToVideo(); drawFrame(); });
            };
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('graph-focus')) graphToggle.click(); });
            const splitter = document.getElementById('splitter');
            let resizePointer = null;
            function setDataWidth(width) {
                const total = document.querySelector('.app-grid').clientWidth;
                const bounded = Math.max(320, Math.min(total - 280, width));
                document.body.style.setProperty('--data-width', bounded + 'px');
                splitter.setAttribute('aria-valuemin', '320');
                splitter.setAttribute('aria-valuemax', Math.max(320, total - 280));
                splitter.setAttribute('aria-valuenow', Math.round(bounded));
                resizeCanvasToVideo(); drawFrame(); ch.resize();
            }
            splitter.onpointerdown = e => { resizePointer = e.pointerId; splitter.setPointerCapture(e.pointerId); e.preventDefault(); };
            splitter.onpointermove = e => { if (resizePointer === e.pointerId) setDataWidth(document.querySelector('.app-grid').getBoundingClientRect().right - e.clientX); };
            splitter.onpointerup = splitter.onpointercancel = () => { resizePointer = null; };
            splitter.onkeydown = e => {
                if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
                e.preventDefault(); setDataWidth(document.querySelector('.data-panel').clientWidth + (e.key === 'ArrowLeft' ? 30 : -30));
            };
            window.addEventListener('resize', () => { if (innerWidth > 820) setDataWidth(document.querySelector('.data-panel').clientWidth); });


            function getCurrentTrack() {
                return tracks[currentTrackId];
            }

            function getCurrentPoints() {
                return getCurrentTrack().points;
            }

            function getTrackById(trackId) {
                return tracks[trackId];
            }

            function applyTimeRangeByDataset(datasetList) {
                const lockToPlot = !!chkPlotRange?.checked;
                if (!lockToPlot) {
                    ch.options.scales.x.min = 0;
                    ch.options.scales.x.max = undefined;
                    return;
                }
                const validX = [];
                for (const ds of datasetList || []) {
                    for (const p of (ds?.data || [])) {
                        if (Number.isFinite(p?.x) && Number.isFinite(p?.y)) validX.push(p.x);
                    }
                }
                if (!validX.length) {
                    ch.options.scales.x.min = 0;
                    ch.options.scales.x.max = undefined;
                    return;
                }
                const lo = Math.min(...validX);
                const hi = Math.max(...validX);
                if (Math.abs(hi - lo) < 1e-9) {
                    const pad = 0.05;
                    ch.options.scales.x.min = Math.max(0, lo - pad);
                    ch.options.scales.x.max = lo + pad;
                    return;
                }
                const pad = (hi - lo) * 0.02;
                ch.options.scales.x.min = Math.max(0, lo - pad);
                ch.options.scales.x.max = hi + pad;
            }

            function refreshCurrentTrackInfo() {
                const current = getCurrentTrack();
                const pts = current.points;
                kPoints.textContent = String(pts.length);
                kTime.textContent = pts.length > 1 ? (pts[pts.length - 1].t - pts[0].t).toFixed(3) : '0.000';
                originInfo.textContent = current.origin ? '原点: 設定済み' : '原点: 未設定';
            }

            function resizeCanvasToVideo() {
                const container = canvas.parentElement;
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 360;
                canvas.width = vw;
                canvas.height = vh;
                drawFrame();
            }
            window.addEventListener('resize', () => { setTimeout(resizeCanvasToVideo, 100); });
            if (window.innerWidth < 820 && btnCSVMobile) btnCSVMobile.style.display = 'block';

            function drawInfiniteLine(point, dir, color, width = 2) {
                const w = canvas.width, h = canvas.height;
                const L = Math.max(w, h) * 2;
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(point.x - dir.x * L, point.y - dir.y * L);
                ctx.lineTo(point.x + dir.x * L, point.y + dir.y * L);
                ctx.stroke();
                ctx.restore();
            }

            function drawAxisOverlay() {
                const ex = { x: Math.cos(axis.theta), y: Math.sin(axis.theta) };
                const ey = { x: Math.sin(axis.theta), y: -Math.cos(axis.theta) };
                drawInfiniteLine({ x: axis.ox, y: axis.oy }, ex, '#10b981');
                drawInfiniteLine({ x: axis.ox, y: axis.oy }, ey, '#3b82f6');
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath(); ctx.arc(axis.ox, axis.oy, AXIS_HANDLE_R, 0, Math.PI * 2); ctx.fill();
                const hx = axis.ox + ex.x * AXIS_HANDLE_LEN;
                const hy = axis.oy + ex.y * AXIS_HANDLE_LEN;
                ctx.fillStyle = '#facc15';
                ctx.beginPath(); ctx.arc(hx, hy, AXIS_HANDLE_R, 0, Math.PI * 2); ctx.fill();
                ctx.font = '24px sans-serif';
                ctx.fillStyle = '#10b981';
                ctx.fillText('x', axis.ox + ex.x * (AXIS_HANDLE_LEN + 25), axis.oy + ex.y * (AXIS_HANDLE_LEN + 25));
                ctx.fillStyle = '#3b82f6';
                ctx.fillText('y', axis.ox + ey.x * (AXIS_HANDLE_LEN + 25), axis.oy + ey.y * (AXIS_HANDLE_LEN + 25));
            }

            function drawFrame() {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                if (!isNaN(video.duration)) {
                    ctx.drawImage(video, 0, 0, w, h);
                }
                if (calibMode) {
                    if (calibDragging && calibStart) {
                        const a = calibStart, b = (calibEnd || mousePos);
                        ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                        const d = Math.hypot(b.x - a.x, b.y - a.y);
                        ctx.fillStyle = '#fde68a'; ctx.font = '24px sans-serif';
                        ctx.fillText(`${d.toFixed(1)} px`, (a.x + b.x) / 2 + 10, (a.y + b.y) / 2 - 10);
                    }
                }
                if (axisMode) drawAxisOverlay();
                TRACKS.forEach(trackMeta => {
                    const pts = getTrackById(trackMeta.id).points;
                    if (!pts.length) return;
                    const selected = trackMeta.id === currentTrackId;
                    ctx.strokeStyle = trackMeta.lineColor;
                    ctx.globalAlpha = selected ? 1 : 0.55;
                    ctx.lineWidth = selected ? 2.5 : 1.5;
                    ctx.beginPath();
                    ctx.moveTo(pts[0].xpx, pts[0].ypx);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].xpx, pts[i].ypx);
                    ctx.stroke();
                    for (let i = 0; i < pts.length; i++) {
                        ctx.fillStyle = trackMeta.pointColor;
                        ctx.beginPath();
                        ctx.arc(pts[i].xpx, pts[i].ypx, selected ? 6 : 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                });
            }

            let mousePos = { x: 0, y: 0 };

            function getXY(evt) {
                const rect = canvas.getBoundingClientRect();
                const clientX = evt.clientX - rect.left;
                const clientY = evt.clientY - rect.top;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return { x: clientX * scaleX, y: clientY * scaleY };
            }

            let dragMode = null;
            function hitCircle(px, py, cx, cy, r) { return Math.hypot(px - cx, py - cy) <= r; }

            canvas.addEventListener('pointermove', e => {
                mousePos = getXY(e);
                if (calibMode && calibDragging) { calibEnd = getXY(e); }
                if (axisMode && dragMode) {
                    if (dragMode === 'moveOrigin') { axis.ox = mousePos.x; axis.oy = mousePos.y; }
                    else if (dragMode === 'rotate') { axis.theta = Math.atan2(mousePos.y - axis.oy, mousePos.x - axis.ox); }
                }
                drawFrame();
            }, { passive: false });

            canvas.addEventListener('pointerdown', async e => {
                e.preventDefault();
                if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
                const p = getXY(e);

                if (!videoReady) return;
                if (axisMode) {
                    const ex = { x: Math.cos(axis.theta), y: Math.sin(axis.theta) };
                    const hx = axis.ox + ex.x * AXIS_HANDLE_LEN;
                    const hy = axis.oy + ex.y * AXIS_HANDLE_LEN;
                    const hitR = AXIS_HANDLE_R * 3;
                    if (hitCircle(p.x, p.y, axis.ox, axis.oy, hitR)) dragMode = 'moveOrigin';
                    else if (hitCircle(p.x, p.y, hx, hy, hitR)) dragMode = 'rotate';
                    else dragMode = null;
                    return;
                }

                if (calibMode) {
                    calibStart = p; calibEnd = p; calibDragging = true;
                    drawFrame(); return;
                }

                if (!axisActive) {
                    if (scalePxPerMeter == null) alert('先にスケール設定を行ってください。');
                    else alert('先に座標軸（原点・向き）を設定してください。');
                    return;
                }

                recordPoint(p.x, p.y, video.currentTime);
                if (autoStep.checked) await stepFrame(+1);
            }, { passive: false });

            canvas.addEventListener('pointerup', e => {
                if (canvas.releasePointerCapture) {
                    try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }
                }
                if (calibMode && calibDragging && calibStart) {
                    calibEnd = getXY(e);
                    finalizeCalibration(calibStart, calibEnd);
                }
                dragMode = null;
            }, { passive: false });

            function finalizeCalibration(a, b) {
                const dpx = Math.hypot(b.x - a.x, b.y - a.y);
                const refMetersRaw = parseFloat(calibLengthInput?.value);
                const refMeters = Number.isFinite(refMetersRaw) && refMetersRaw > 0 ? refMetersRaw : 1;
                if (dpx > 0) {
                    dirty = true;
                    scalePxPerMeter = dpx / refMeters;
                    const refMetersLabel = Number.isInteger(refMeters) ? String(refMeters) : refMeters.toFixed(3).replace(/\.?0+$/, '');
                    scaleInfo.textContent = `スケール: ${dpx.toFixed(1)} px = ${refMetersLabel} m`;
                    kScale.textContent = scalePxPerMeter.toFixed(2);
                    btnAxis.disabled = false;
                }
                calibMode = false; calibDragging = false; calibStart = calibEnd = null;
                btnCalib.disabled = false;
                drawFrame();
            }

            function pxToAxisMeters(xpx, ypx) {
                if (!scalePxPerMeter) return { xm: NaN, ym: NaN };
                const vx = xpx - axis.ox, vy = ypx - axis.oy;
                const c = Math.cos(axis.theta), s = Math.sin(axis.theta);
                const xr_px = vx * c + vy * s;
                const yr_px = vx * s + vy * (-c);
                return { xm: xr_px / scalePxPerMeter, ym: yr_px / scalePxPerMeter };
            }

            function recordPoint(xpx, ypx, t) {
                if (scalePxPerMeter == null) { alert('先にスケール設定を行ってください。'); return; }
                if (axisActive !== true) { axis.theta = axis.theta || 0; }
                const loc = pxToAxisMeters(xpx, ypx);
                const current = getCurrentTrack();
                if (current.points.length === 0 && !current.origin) {
                    current.origin = { xm: loc.xm, ym: loc.ym };
                    originInfo.textContent = '原点: 設定済み';
                }
                const xm = loc.xm - (current.origin?.xm ?? 0);
                const ym = loc.ym - (current.origin?.ym ?? 0);

                const same = current.points.findIndex(p => Math.abs(p.t - t) < 0.5 / (Number(fpsInput.value) || 30));
                if (same >= 0) current.points.splice(same, 1);
                current.points.push({ t, xpx, ypx, xm, ym });
                dirty = true;
                current.points.sort((a, b) => a.t - b.t);
                refreshCurrentTrackInfo();
                recompute();
                drawFrame();
            }

            function recompute() {
                modeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
                const points = getCurrentPoints();
                if (points.length === 0) { renderTable([], [], [], [], [], [], []); updateMainChart([], [], [], [], [], [], []); return; }
                const t = points.map(p => p.t);
                const x = points.map(p => p.xm);
                const y = points.map(p => p.ym);
                const regHalfWindow = Math.max(1, Math.floor(parseFloat(regHalfWindowInput?.value) || 7));
                const regX = localQuadraticDerivatives(t, x, regHalfWindow);
                const regY = localQuadraticDerivatives(t, y, regHalfWindow);
                const vx = regX.v;
                const vy = regY.v;
                const ax = regX.a;
                const ay = regY.a;
                renderTable(t, x, y, vx, vy, ax, ay);
                updateMainChart(t, x, y, vx, vy, ax, ay);
            }

            function updateMainChart(t, x, y, vx, vy, ax, ay) {
                if (mode === 'springnorm') {
                    const springData = buildSpringOverlaySeries();
                    ch.data.labels = [];
                    const datasets = [];
                    if (seriesForce?.checked !== false) datasets.push({ label: '弾性力(正規化)', data: springData.fNorm, pointRadius: 0, tension: 0, borderColor: '#f43f5e', backgroundColor: '#f43f5e' });
                    if (seriesPos?.checked !== false) datasets.push({ label: '位置(正規化)', data: springData.xNorm, pointRadius: 0, tension: 0, borderColor: '#22c55e', backgroundColor: '#22c55e' });
                    if (seriesVel?.checked !== false) datasets.push({ label: '速度(正規化)', data: springData.vNorm, pointRadius: 0, tension: 0, borderColor: '#3b82f6', backgroundColor: '#3b82f6' });
                    if (seriesAcc?.checked !== false) datasets.push({ label: '加速度(正規化)', data: springData.aNorm, pointRadius: 0, tension: 0, borderColor: '#f59e0b', backgroundColor: '#f59e0b' });
                    ch.data.datasets = datasets;
                    ch.options.plugins.legend.display = false;
                    ch.options.scales.y.title.text = '正規化値 [0..1]';
                    ch.options.scales.y.min = 0;
                    ch.options.scales.y.max = 1;
                    applyTimeRangeByDataset(ch.data.datasets);
                    if (seriesToggleRow) seriesToggleRow.style.display = 'flex';
                    ch.update();
                    modeButtons.forEach(b => {
                        b.style.backgroundColor = (b.dataset.mode === mode) ? '#2563eb' : '#334155';
                    });
                    return;
                }

                let data = [], ylabel = '';
                switch (mode) {
                    case 'xt': data = x; ylabel = 'x [m]'; break;
                    case 'yt': data = y; ylabel = 'y [m]'; break;
                    case 'vxt': data = vx; ylabel = 'vx [m/s]'; break;
                    case 'vyt': data = vy; ylabel = 'vy [m/s]'; break;
                    case 'axt': data = ax; ylabel = 'ax [m/s^2]'; break;
                    case 'ayt': data = ay; ylabel = 'ay [m/s^2]'; break;
                }
                if (seriesToggleRow) seriesToggleRow.style.display = 'none';
                ch.options.plugins.legend.display = false;
                if (t && t.length > 0 && data && data.length > 0) {
                    const scatterData = t.map((timeVal, i) => ({ x: timeVal, y: data[i] }));
                    ch.data.datasets = [{ label: mode.toUpperCase(), data: scatterData, pointRadius: 2, tension: 0, borderColor: '#3b82f6', backgroundColor: '#3b82f6' }];
                } else {
                    ch.data.datasets = [{ label: mode.toUpperCase(), data: [], pointRadius: 2, tension: 0, borderColor: '#3b82f6', backgroundColor: '#3b82f6' }];
                }
                ch.data.labels = [];
                ch.options.scales.y.title.text = ylabel;
                applyTimeRangeByDataset(ch.data.datasets);

                if (Array.isArray(data) && data.length) {
                    let dmin = Infinity, dmax = -Infinity;
                    for (const v of data) { if (Number.isFinite(v)) { dmin = Math.min(dmin, v); dmax = Math.max(dmax, v); } }
                    if (!Number.isFinite(dmin) || !Number.isFinite(dmax)) { dmin = -1; dmax = 1; }
                    let lo = Math.min(0, dmin), hi = Math.max(0, dmax);
                    if (Math.abs(hi - lo) < 1e-6) { const pad = (Math.abs(hi) || 1) * 0.5; lo -= pad; hi += pad; }
                    else { const pad = (hi - lo) * 0.05; lo -= pad; hi += pad; }
                    ch.options.scales.y.min = lo; ch.options.scales.y.max = hi;
                } else { ch.options.scales.y.min = -1; ch.options.scales.y.max = 1; }
                ch.update();
                modeButtons.forEach(b => {
                    b.style.backgroundColor = (b.dataset.mode === mode) ? '#2563eb' : '#334155';
                });
            }

            function buildSpringOverlaySeries() {
                const massTrackId = massTrackSelect?.value || 'obj1';
                const springTrackId = springTrackSelect?.value || 'obj2';
                const massPts = getTrackById(massTrackId)?.points || [];
                const springPts = getTrackById(springTrackId)?.points || [];
                if (!massPts.length) return { fNorm: [], xNorm: [], vNorm: [], aNorm: [], forceRaw: [] };

                const t = massPts.map(p => p.t);
                const x = massPts.map(p => p.xm);
                const half = Math.max(1, Math.floor(parseFloat(regHalfWindowInput?.value) || 7));
                const reg = localQuadraticDerivatives(t, x, half);
                const springAtT = pickTrackAtSameTimes(springPts, t);

                const springK = parseFloat(springKInput?.value);
                const k = Number.isFinite(springK) ? springK : 0;
                let l0 = NaN;
                for (let i = 0; i < massPts.length; i++) {
                    const s = springAtT[i];
                    if (!s || !Number.isFinite(s.xm) || !Number.isFinite(s.ym)) continue;
                    l0 = Math.hypot(massPts[i].xm - s.xm, massPts[i].ym - s.ym);
                    break;
                }

                const forceRaw = massPts.map((p, i) => {
                    const s = springAtT[i];
                    if (!s || !Number.isFinite(s.xm) || !Number.isFinite(s.ym) || !Number.isFinite(l0)) return NaN;
                    const length = Math.hypot(p.xm - s.xm, p.ym - s.ym);
                    return k * (length - l0);
                });

                const fNormVals = normalize01(forceRaw);
                const xNormVals = normalize01(reg.pos);
                const vNormVals = normalize01(reg.v);
                const aNormVals = normalize01(reg.a);

                return {
                    fNorm: t.map((tv, i) => ({ x: tv, y: fNormVals[i] })),
                    xNorm: t.map((tv, i) => ({ x: tv, y: xNormVals[i] })),
                    vNorm: t.map((tv, i) => ({ x: tv, y: vNormVals[i] })),
                    aNorm: t.map((tv, i) => ({ x: tv, y: aNormVals[i] })),
                    forceRaw
                };
            }

            function pickTrackAtSameTimes(points, tSeries) {
                if (!points || points.length === 0) return tSeries.map(() => ({ xm: NaN, ym: NaN }));
                const map = new Map();
                for (const p of points) map.set(p.t.toFixed(6), p);
                return tSeries.map(t => {
                    const p = map.get(t.toFixed(6));
                    return p ? { xm: p.xm, ym: p.ym } : { xm: NaN, ym: NaN };
                });
            }

            function interpolateTrackAtTimes(points, tSeries) {
                if (!points || points.length === 0) return tSeries.map(() => ({ xm: NaN, ym: NaN }));
                const out = [];
                let j = 0;
                for (const t of tSeries) {
                    if (t <= points[0].t) {
                        out.push({ xm: points[0].xm, ym: points[0].ym });
                        continue;
                    }
                    if (t >= points[points.length - 1].t) {
                        const pLast = points[points.length - 1];
                        out.push({ xm: pLast.xm, ym: pLast.ym });
                        continue;
                    }
                    while (j + 1 < points.length && points[j + 1].t < t) j++;
                    const p0 = points[j];
                    const p1 = points[j + 1];
                    const dt = p1.t - p0.t;
                    if (!(dt > 0)) {
                        out.push({ xm: p0.xm, ym: p0.ym });
                        continue;
                    }
                    const r = (t - p0.t) / dt;
                    out.push({ xm: p0.xm + (p1.xm - p0.xm) * r, ym: p0.ym + (p1.ym - p0.ym) * r });
                }
                return out;
            }

            function normalize01(values) {
                const finiteVals = values.filter(v => Number.isFinite(v));
                if (!finiteVals.length) return values.map(() => NaN);
                const lo = Math.min(...finiteVals);
                const hi = Math.max(...finiteVals);
                if (Math.abs(hi - lo) < 1e-12) return values.map(v => (Number.isFinite(v) ? 0.5 : NaN));
                return values.map(v => (Number.isFinite(v) ? (v - lo) / (hi - lo) : NaN));
            }

            function localQuadraticDerivatives(t, y, halfWindow) {
                const n = t.length;
                const pos = new Array(n).fill(NaN);
                const v = new Array(n).fill(NaN);
                const a = new Array(n).fill(NaN);
                if (n === 0) return { pos, v, a };

                const targetCount = Math.max(3, (halfWindow * 2) + 1);
                for (let i = 0; i < n; i++) {
                    const left = i - halfWindow;
                    const right = i + halfWindow;
                    // 端点は「前後に半窓幅の点が揃っていない」ため非表示にする
                    if (left < 0 || right >= n) continue;

                    const tx = [];
                    const yy = [];
                    for (let k = left; k <= right; k++) {
                        if (Number.isFinite(t[k]) && Number.isFinite(y[k])) {
                            tx.push(t[k]);
                            yy.push(y[k]);
                        }
                    }

                    if (tx.length < targetCount) continue;
                    const coeff = fitQuadratic(tx, yy);
                    if (!coeff) continue;

                    const ti = t[i];
                    const qa = coeff[0];
                    const qb = coeff[1];
                    const qc = coeff[2];
                    pos[i] = qa * ti * ti + qb * ti + qc;
                    v[i] = 2 * qa * ti + qb;
                    a[i] = 2 * qa;
                }
                return { pos, v, a };
            }

            function fitQuadratic(t, y) {
                let s0 = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0;
                let sy = 0, sty = 0, st2y = 0;
                for (let i = 0; i < t.length; i++) {
                    const ti = t[i];
                    const yi = y[i];
                    const t2 = ti * ti;
                    s0 += 1;
                    s1 += ti;
                    s2 += t2;
                    s3 += t2 * ti;
                    s4 += t2 * t2;
                    sy += yi;
                    sty += ti * yi;
                    st2y += t2 * yi;
                }

                const A = [[s4, s3, s2], [s3, s2, s1], [s2, s1, s0]];
                const b = [st2y, sty, sy];
                return solveLinear3(A, b);
            }

            function solveLinear3(A, b) {
                const m = [[A[0][0], A[0][1], A[0][2], b[0]], [A[1][0], A[1][1], A[1][2], b[1]], [A[2][0], A[2][1], A[2][2], b[2]]];
                for (let col = 0; col < 3; col++) {
                    let pivot = col;
                    for (let row = col + 1; row < 3; row++) if (Math.abs(m[row][col]) > Math.abs(m[pivot][col])) pivot = row;
                    if (Math.abs(m[pivot][col]) < 1e-12) return null;
                    if (pivot !== col) {
                        const tmp = m[col];
                        m[col] = m[pivot];
                        m[pivot] = tmp;
                    }
                    const div = m[col][col];
                    for (let j = col; j < 4; j++) m[col][j] /= div;
                    for (let row = 0; row < 3; row++) {
                        if (row === col) continue;
                        const factor = m[row][col];
                        for (let j = col; j < 4; j++) m[row][j] -= factor * m[col][j];
                    }
                }
                return [m[0][3], m[1][3], m[2][3]];
            }

            function detectFPSOnce() {
                if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
                    let frameCount = 0;
                    let t0 = 0;

                    const cb = (_, info) => {
                        if (frameCount === 0) {
                            t0 = info.mediaTime;
                            frameCount++;
                            video.requestVideoFrameCallback(cb);
                        } else if (frameCount === 1) {
                            const t1 = info.mediaTime;
                            const diff = t1 - t0;
                            if (diff > 0.001) {
                                const fps = 1 / diff;
                                if (fps > 5 && fps < 240) {
                                    fpsInput.value = fps.toFixed(2);
                                    kFPS.textContent = fps.toFixed(2);
                                }
                            }
                        }
                    };
                    video.requestVideoFrameCallback(cb);
                }
            }

            // Frame stepping
            async function stepFrame(dir) {
                video.pause();
                playing = false;
                btnPlay.textContent = '再生';

                const fps = parseFloat(fpsInput.value) || 30;
                const frameDur = 1.0 / fps;

                // Current frame index
                let currentFrameIndex = Math.round(video.currentTime * fps);

                // Next frame index
                let nextFrameIndex = currentFrameIndex + dir;

                // Target seek time (slightly inside frame)
                // Seek slightly inside the target frame to avoid edge ambiguity
                // This improves consistency on some browser decoders
                let targetTime = (nextFrameIndex * frameDur) + (frameDur * 0.05);

                // Clamp to valid time range
                targetTime = Math.max(0, Math.min(targetTime, video.duration - 0.001));

                // No-op if time is unchanged
                if (Math.abs(targetTime - video.currentTime) < 0.0001) return;

                return seekTo(targetTime);
            }

            function seekTo(t) {
                return new Promise(res => {
                    const onSeeked = () => {
                        clearTimeout(timer);
                        drawFrame();
                        requestAnimationFrame(() => { drawFrame(); res(); });
                    };
                    video.addEventListener('seeked', onSeeked, { once: true });
                    const timer = setTimeout(() => { drawFrame(); res(); }, 300);
                    video.currentTime = t;
                });
            }

            btnPrev.onclick = async () => { await stepFrame(-1); };
            btnNext.onclick = async () => { await stepFrame(+1); };
            btnPlay.onclick = () => { if (!playing) { video.play(); } else { video.pause(); } };

            btnCalib.onclick = () => {
                if (!videoReady) return alert('先に動画を読み込んでください。');
                video.pause(); axisActive = false; axisMode = false;
                btnStartPlot.textContent = '計測開始';
                calibMode = true; calibDragging = false; calibStart = calibEnd = null;
                btnCalib.disabled = true; scaleInfo.textContent = 'ドラッグして基準長を指定';
            };
            btnAxis.onclick = () => {
                video.pause(); dirty = true;
                axisMode = true; axisActive = false;
                btnStartPlot.disabled = false;
                btnStartPlot.textContent = '計測開始';
                drawFrame();
            };
            btnStartPlot.onclick = () => {
                video.pause(); axisMode = false; axisActive = !axisActive;
                btnStartPlot.textContent = axisActive ? '計測を停止' : '計測開始';
                dirty = true;
                drawFrame();
            };
            btnUndo.onclick = async () => {
                const points = getCurrentPoints();
                if (points.length) {
                    points.pop();
                    if (!points.length) getCurrentTrack().origin = null;
                    dirty = true;
                    refreshCurrentTrackInfo();
                    recompute();
                    // 1フレーム戻す
                    await stepFrame(-1);
                }
            };
            btnClear.onclick = () => {
                if (confirm('記録した計測点とスケール・座標軸をすべて削除しますか？')) {
                    resetAll(); dirty = true; drawFrame();
                }
            };

            const downloadCSV = () => {
                const massTrackId = massTrackSelect?.value || 'obj1';
                const points = getTrackById(massTrackId)?.points || [];
                if (!points.length) return alert('データがありません。');
                let csv = "t[s],x[m],y[m],vx[m/s],vy[m/s],ax[m/s^2],ay[m/s^2],springForce[N]\n";
                const t = points.map(p => p.t);
                const x = points.map(p => p.xm);
                const y = points.map(p => p.ym);
                const regHalfWindow = Math.max(1, Math.floor(parseFloat(regHalfWindowInput?.value) || 7));
                const regX = localQuadraticDerivatives(t, x, regHalfWindow);
                const regY = localQuadraticDerivatives(t, y, regHalfWindow);
                const vx = regX.v;
                const vy = regY.v;
                const ax = regX.a;
                const ay = regY.a;
                const springOverlay = buildSpringOverlaySeries();
                const force = springOverlay.forceRaw || [];
                for (let i = 0; i < points.length; i++) {
                    csv += `${t[i]},${x[i]},${y[i]},${vx[i]},${vy[i]},${ax[i]},${ay[i]},${force[i]}` + "\n";
                }
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `motion_data_${massTrackId}.csv`; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            btnCSV.onclick = downloadCSV;
            if (btnCSVMobile) btnCSVMobile.onclick = downloadCSV;

            btnPNGCurrent.onclick = () => {
                const url = ch.toBase64Image();
                const a = document.createElement('a');
                a.href = url; a.download = 'chart.png'; a.click();
            };
            modeButtons.forEach(btn => {
                btn.onclick = () => { mode = btn.dataset.mode; dirty = true; recompute(); };
            });
            if (trackSelect) {
                trackSelect.value = currentTrackId;
                trackSelect.onchange = () => {
                    currentTrackId = trackSelect.value;
                    refreshCurrentTrackInfo();
                    recompute();
                    drawFrame();
                    updateCursorFromVideo();
                };
            }

            [springKInput, regHalfWindowInput, massTrackSelect, springTrackSelect].forEach(el => {
                if (!el) return;
                el.addEventListener('input', () => recompute());
                el.addEventListener('change', () => recompute());
            });
            [chkPlotRange, seriesForce, seriesPos, seriesVel, seriesAcc].forEach(el => {
                if (!el) return;
                el.addEventListener('input', () => recompute());
                el.addEventListener('change', () => recompute());
            });
            if (btnToggleKpi && kpiGrid) {
                btnToggleKpi.onclick = () => {
                    const hidden = kpiGrid.style.display === 'none';
                    kpiGrid.style.display = hidden ? 'grid' : 'none';
                    btnToggleKpi.textContent = hidden ? '指標を隠す' : '指標を表示';
                };
            }

            file.addEventListener('change', async e => {
                const selected = e.target.files?.[0];
                if (!selected) return;
                try { await loadVideo(URL.createObjectURL(selected), { name: selected.name, size: selected.size }); }
                catch (error) { alert(error.message); }
                file.value = '';
            });
            btnDemo.onclick = async () => {
                try { await loadVideo(DEMO_URL, { name: 'demo_faststart.mp4', size: null }); }
                catch (error) { alert(error.message); }
            };

            async function loadVideo(url, info) {
                if (loadingVideo) { if (url.startsWith('blob:')) URL.revokeObjectURL(url); return; }
                if (!pendingAnalysis && !allowReplace()) { if (url.startsWith('blob:')) URL.revokeObjectURL(url); return; }
                loadingVideo = true;
                const loadControls = [file, btnDemo, document.getElementById('btnAnalysisOpen'), cancelRestore];
                loadControls.forEach(el => { el.disabled = true; });
                const probe = document.createElement('video');
                probe.preload = 'metadata';
                try {
                    await new Promise((resolve, reject) => {
                        const timer = setTimeout(() => finish(new Error('動画の読み込みがタイムアウトしました。')), 15000);
                        function finish(error) { clearTimeout(timer); probe.onloadedmetadata = probe.onerror = null; error ? reject(error) : resolve(); }
                        probe.onloadedmetadata = () => finish();
                        probe.onerror = () => finish(new Error('動画を読み込めません。MP4など対応する形式を選んでください。'));
                        probe.src = url;
                    });
                    if (!Number.isFinite(probe.duration) || !probe.videoWidth) throw new Error('動画の長さまたはサイズを取得できません。');
                    if (pendingAnalysis && !matchesVideo(pendingAnalysis.video, { ...info, duration:probe.duration, width:probe.videoWidth, height:probe.videoHeight })) {
                        throw new Error('解析保存時と動画の名前・サイズ・長さ・解像度が一致しません。対応する元動画を選択してください。');
                    }
                    video.pause(); videoReady = false;
                    const oldUrl = video.getAttribute('src');
                    await new Promise((resolve, reject) => {
                        const timer = setTimeout(() => finish(new Error('動画を表示できませんでした。')), 15000);
                        function finish(error) { clearTimeout(timer); video.onloadeddata = video.onerror = null; error ? reject(error) : resolve(); }
                        video.onloadeddata = () => finish();
                        video.onerror = () => finish(new Error('動画を表示できませんでした。'));
                        video.src = url; video.load();
                    });
                    currentVideoInfo = { ...info, duration:video.duration, width:video.videoWidth, height:video.videoHeight };
                    videoReady = true;
                    resetAll(); resizeCanvasToVideo();
                    if (pendingAnalysis) { const saved = pendingAnalysis; pendingAnalysis = null; cancelRestore.hidden = true; applyAnalysis(saved); }
                    else { dirty = false; status.textContent = info.name + '：スケール設定から計測を始めてください。'; }
                    if (oldUrl?.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
                    updateTimeline(); drawFrame();
                } catch (error) { if (url.startsWith('blob:') && video.getAttribute('src') !== url) URL.revokeObjectURL(url); throw error; }
                finally {
                    probe.removeAttribute('src'); probe.load(); loadingVideo = false;
                    loadControls.forEach(el => { el.disabled = false; });
                }
            }

            function resetAll() {
                tracks = Object.fromEntries(TRACKS.map(t => [t.id, { points: [], origin: null }]));
                currentTrackId = 'obj1';
                if (trackSelect) trackSelect.value = currentTrackId;
                scalePxPerMeter = null;
                calibMode = false;
                calibDragging = false;
                axisActive = false;
                axisMode = false;
                axis = { ox:(video.videoWidth || 640) / 2, oy:(video.videoHeight || 360) / 2, theta:0 };
                calibStart = calibEnd = null;
                btnCalib.disabled = false;
                btnAxis.disabled = true;
                btnStartPlot.disabled = true;
                btnStartPlot.textContent = '計測開始';
                kScale.textContent = '--';
                scaleInfo.textContent = 'スケール: 未設定';
                if (massTrackSelect) massTrackSelect.value = 'obj1';
                if (springTrackSelect) springTrackSelect.value = 'obj2';
                refreshCurrentTrackInfo();
                ch.data.labels = [];
                ch.data.datasets.forEach(ds => { ds.data = []; });
                ch.update();
                recompute();
            }

            function renderTable(t, x, y, vx, vy, ax, ay) {
                const tb = document.getElementById('tableBody'); if (!tb) return;
                const points = getCurrentPoints();
                let html = '';
                for (let i = 0; i < points.length; i++) {
                    html += `<tr><td>${i}</td><td>${(t[i] ?? NaN).toFixed(3)}</td><td>${(x[i] ?? NaN).toFixed(3)}</td><td>${(y[i] ?? NaN).toFixed(3)}</td><td>${(Number.isFinite(vx[i]) ? vx[i].toFixed(2) : '—')}</td><td>${(Number.isFinite(vy[i]) ? vy[i].toFixed(2) : '—')}</td></tr>`;
                }
                tb.innerHTML = html;
            }

            const cursor = document.getElementById('time-cursor');
            const chartBox = document.getElementById('chartBox');
            let isDraggingGraph = false;

            video.addEventListener('timeupdate', () => { if (video.paused) updateCursorFromVideo(); });
            function updateCursorFromVideo() {
                const points = getCurrentPoints();
                if (isDraggingGraph || !points.length || !ch.scales.x) return;
                const val = video.currentTime;
                const x = ch.scales.x.getPixelForValue(val);
                const chartArea = ch.chartArea;
                if (chartArea && x >= chartArea.left && x <= chartArea.right) {
                    cursor.style.display = 'block';
                    cursor.style.left = `${x}px`;
                    cursor.style.top = `${chartArea.top}px`;
                    cursor.style.height = `${chartArea.bottom - chartArea.top}px`;
                } else {
                    cursor.style.display = 'none';
                }
            }

            chartBox.addEventListener('pointerdown', (e) => {
                const points = getCurrentPoints();
                if (!points.length) return;
                isDraggingGraph = true;
                video.pause();
                e.preventDefault();
                if (chartBox.setPointerCapture) chartBox.setPointerCapture(e.pointerId);
                syncVideoToGraphMouse(e);
            });

            window.addEventListener('pointermove', (e) => {
                if (isDraggingGraph) {
                    e.preventDefault();
                    syncVideoToGraphMouse(e);
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (isDraggingGraph) {
                    isDraggingGraph = false;
                    if (chartBox.releasePointerCapture && e?.pointerId != null) {
                        try { chartBox.releasePointerCapture(e.pointerId); } catch (_) { }
                    }
                    updateCursorFromVideo();
                }
            });

            function syncVideoToGraphMouse(e) {
                if (!ch.scales.x) return;
                const rect = chartBox.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                let targetTime = ch.scales.x.getValueForPixel(mouseX);
                targetTime = Math.max(0, Math.min(targetTime, video.duration || 0));

                const chartArea = ch.chartArea;
                if (chartArea && mouseX >= chartArea.left && mouseX <= chartArea.right) {
                    cursor.style.display = 'block';
                    cursor.style.left = `${mouseX}px`;
                    cursor.style.top = `${chartArea.top}px`;
                    cursor.style.height = `${chartArea.bottom - chartArea.top}px`;
                }
                if (Number.isFinite(targetTime)) {
                    video.currentTime = targetTime;
                }
            }

            function renderLoop() {
                if (video.paused || video.ended) return;
                drawFrame();
                updateCursorFromVideo();
                requestAnimationFrame(renderLoop);
            }
            video.addEventListener('seeked', () => {
                if (video.paused) {
                    drawFrame();
                    if (!isDraggingGraph) updateCursorFromVideo();
                }
            });
            video.addEventListener('play', () => { playing = true; btnPlay.textContent = '一時停止'; renderLoop(); });
            video.addEventListener('pause', () => { playing = false; btnPlay.textContent = '再生'; drawFrame(); updateCursorFromVideo(); });

        })();
    </script>
